name: GlassScan
options:
  bundleIdPrefix: com.xinyunhang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  GlassScan:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassScan
        excludes:
          - "README.md"
    info:
      path: GlassScan/Info.plist
      properties:
        CFBundleDisplayName: GlassScan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "扫描胖乖洗澡与 U净洗衣设备二维码"
        NSPhotoLibraryUsageDescription: "从相册选取二维码图片进行识别"
        NSLocationWhenInUseUsageDescription: "用于搜索你附近的 U净洗衣房空闲看板"
        LSApplicationQueriesSchemes:
          - alipay
          - alipays
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.xinyunhang.glassscan
            CFBundleURLSchemes:
              - glassscan
    settings:
      base:
        PRODUCT_NAME: GlassScan
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
