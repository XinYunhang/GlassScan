name: GlassScan
options:
  bundleIdPrefix: com.xinyunhang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  GlassScan:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassScan
        excludes:
          - "README.md"
    settings:
      base:
        PRODUCT_NAME: GlassScan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GlassScan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描设备二维码并自动记录解析与接口探测数据"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "从相册选取二维码图片进行解析与探测"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
